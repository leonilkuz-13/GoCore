syntax = "proto3";

package movies.v1;

option go_package = "github.com/leonilkuz-13/GoCore/api/proto;moviesv1";

service MovieService {
  rpc LoadMovies(LoadMoviesRequest) returns (LoadMoviesResponse);
  rpc GetLastMovie(GetLastMovieRequest) returns (Movie);
}

message LoadMoviesRequest {
  int64 from = 1;
  int64 to = 2;
}

message LoadMoviesResponse {
  repeated MovieResult results = 1;
}

message GetLastMovieRequest {}

message Movie {
  int64 id = 1;
  string title = 2;
  int64 year = 3;
  string director = 4;
}

message MovieResult {
  int64 id = 1;
  Movie movie = 2;
  string error = 3;
}
